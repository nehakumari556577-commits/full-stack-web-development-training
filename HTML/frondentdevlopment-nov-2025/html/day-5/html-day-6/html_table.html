<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indixpert Email Layout</title>
</head>
<body>

    <main>
        <section>
            <table border="1" width="100%">

                <tbody>
                    <tr>
                        <td rowspan="5" align="center" width="150">
                            <img src="https://images.unsplash.com/photo-1516321497487-e288fb19713f?w=200"
                                 width="150"
                                 height="400"
                                 alt="Creative Vector Image">
                            <br><br>
                            <b>Creative<br>Vector<br>Image</b>
                        </td>

                        <td colspan="3" align="center" height="80">
                            <img src="logo.png" alt="Indixpert Logo" width="180">
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3" align="center" height="100">
                            <h2>Email Body</h2>
                            <p>Welcome to Indixpert. This is the email body section.</p>
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3" height="30"></td>
                    </tr>

                    <tr>
                        <td align="center">
                            <img src="https://images.unsplash.com/photo-1503023345310-bd7c1de61c7d?w=200" width="180">
                        </td>

                        <td align="center">
                            <img src="https://images.unsplash.com/photo-1498050108023-c5249f4df085?w=200" width="180">
                        </td>

                        <td align="center">
                            <img src="https://images.unsplash.com/photo-1518770660439-4636190af475?w=200" width="180">
                        </td>
                    </tr>

                    <tr>
                        <td colspan="3" align="center" height="80">
                            <footer>
                                Footer
                            </footer>
                        </td>
                    </tr>

                </tbody>

            </table>
        </section>
    </main>

</body>
</html>
