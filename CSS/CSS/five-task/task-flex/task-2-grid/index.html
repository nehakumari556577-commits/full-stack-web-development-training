<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grid Tasks</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- TASK 1 -->

  <h1>Task 1</h1>

  <div class="task-1">

    <div class="item">One</div>
    <div class="item">Two</div>
    <div class="item">Three</div>
    <div class="item">Four</div>

  </div>


  <!-- TASK 2 -->

  <h1>Task 2</h1>

  <div class="task-2">

    <div class="box one">One</div>
    <div class="box two">Two</div>

  </div>


  <!-- TASK 3 -->

  <h1>Task 3</h1>

  <div class="task-3">

    <div class="card one">One</div>
    <div class="card two">Two</div>
    <div class="card three">Three</div>
    <div class="card four">Four</div>

  </div>


  <!-- TASK 4 -->

  <h1>Task 4</h1>

  <div class="task-4">

    <!-- CARD 1 -->
    <div class="photo-card">

      <img src="https://mdn.github.io/shared-assets/images/examples/balloons1.jpg" alt="balloon">

      <div class="tags">
        <span>balloon</span>
        <span>red</span>
        <span>sky</span>
        <span>blue</span>
        <span>Hot air balloon</span>
      </div>

    </div>


    <!-- CARD 2 -->
    <div class="photo-card">

      <img src="https://mdn.github.io/shared-assets/images/examples/balloons2.jpg" alt="houses">

      <div class="tags">
        <span>balloons</span>
        <span>houses</span>
        <span>train</span>
        <span>harborside</span>
      </div>

    </div>


    <!-- CARD 3 -->
    <div class="photo-card">

      <img src="https://mdn.github.io/shared-assets/images/examples/balloons3.jpg" alt="inflating">

      <div class="tags">
        <span>balloons</span>
        <span>inflating</span>
        <span>green</span>
        <span>blue</span>
      </div>

    </div>


    <!-- CARD 4 -->
    <div class="photo-card">

      <img src="https://mdn.github.io/shared-assets/images/examples/balloons4.jpg " alt="summer">

      <div class="tags">
        <span>balloon</span>
        <span>sun</span>
        <span>sky</span>
        <span>summer</span>
        <span>bright</span>
      </div>

    </div>

  </div>

</body>
</html>
