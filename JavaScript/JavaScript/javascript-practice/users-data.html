<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Placeholder User Table with Search</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #a0ca09;
            margin: 30px;
        }

        h2 {
            text-align: center;
        }

        #searchInput {
            width: 40%;
            display: block;
            margin: 20px auto;
            padding: 12px;
            font-size: 16px;
            border: 2px solid rgb(240, 15, 15);
            border-radius: 5px;
            outline: none;
        }

        #searchInput:focus {
            border-color: #f1410b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        th,
        td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: rgb(13, 9, 241);
            color: white;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ddd;
        }

        #message {
            text-align: center;
            font-size: 18px;
            color: red;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h2>10 Users Data</h2>

    <input type="text" id="searchInput"
        placeholder="Search by Name, Email, Address, Phone, Company...">

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Address</th>
                <th>Phone</th>
                <th>Company</th>
            </tr>
        </thead>

        <tbody id="userTable">

        </tbody>
    </table>

    <p id="message"></p>

    <script>

        const userTable = document.getElementById("userTable");
        const searchInput = document.getElementById("searchInput");
        const message = document.getElementById("message");

        let allUsers = [];

        fetch("https://jsonplaceholder.typicode.com/users")
            .then((response) => response.json())
            .then((users) => {

                allUsers = users;

                displayUsers(allUsers);

            })
            .catch((error) => {

                console.log("Error:", error);

            });


        function displayUsers(users) {

            userTable.innerHTML = "";

            if (users.length === 0) {

                message.innerHTML = "No User Found";
                return;

            }

            message.innerHTML = "";

            users.forEach((user) => {

                userTable.innerHTML += `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>
                        ${user.address.street},
                        ${user.address.city},
                        Zip Code: ${user.address.zipcode}
                    </td>
                    <td>${user.phone}</td>
                    <td>${user.company.name}</td>
                </tr>
                `;

            });

        }


        searchInput.addEventListener("keyup", function () {

            const searchValue = this.value.toLowerCase();

            const filteredUsers = allUsers.filter((user) => {

                return (

                    user.name.toLowerCase().includes(searchValue) ||

                    user.email.toLowerCase().includes(searchValue) ||

                    user.address.street.toLowerCase().includes(searchValue) ||

                    user.address.city.toLowerCase().includes(searchValue) ||

                    user.address.zipcode.toLowerCase().includes(searchValue) ||

                    user.phone.toLowerCase().includes(searchValue) ||

                    user.company.name.toLowerCase().includes(searchValue)

                );

            });

            displayUsers(filteredUsers);

        });

    </script>

</body>

</html>
